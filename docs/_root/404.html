<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Page not found - PyAthena</title>
    <script>
      // A missing page under a version directory, such as a version that is
      // no longer built, redirects to the same path on master.
      (function () {
        var match = window.location.pathname.match(/^\/v\d+\.\d+\.\d+(\/.*)?$/);
        if (match) {
          window.location.replace(
            "/master" + (match[1] || "/") + window.location.search + window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <h1>Page not found</h1>
    <p>See the <a href="/master/index.html">latest PyAthena documentation</a>.</p>
  </body>
</html>
